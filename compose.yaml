services:
  fh5-telemetry:
    build: .
    image: fh5-telemetry:latest
    container_name: fh5-telemetry
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-1234}:8080"    # web UI (the Cloudflare Tunnel points here)
      - "${UDP_PORT:-5300}:5300/udp" # Forza Data Out
    environment:
      # Optional: re-send raw packets to other listeners, e.g. "192.168.1.20:5301,simhub.lan:5300"
      FORWARD_ADDR: ${FORWARD_ADDR:-}
      UDP_PUBLIC_PORT: ${UDP_PORT:-5300} # port named in the "waiting for data" banner
    volumes:
      - fh5-data:/data               # car-styles.json (per-car dash style, shared by all devices)
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

volumes:
  fh5-data:
